<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0914"/>
      <stop offset="50%" stop-color="#131024"/>
      <stop offset="100%" stop-color="#210a30"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1933"/>
      <stop offset="100%" stop-color="#131024"/>
    </linearGradient>
    
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>

    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1000" height="480" rx="16" fill="url(#bgGrad)" stroke="#241c3b" stroke-width="2"/>

  <!-- Title Header -->
  <text x="500" y="42" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f3f0f8" text-anchor="middle" letter-spacing="1">
    CITATION INTEGRITY ENGINE — SYSTEM ARCHITECTURE
  </text>
  <text x="500" y="64" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a29ab5" text-anchor="middle">
    Multi-Agent Adversarial Verification State Machine (Express Node.js Backend &amp; React Frontend)
  </text>

  <!-- Connectors / Paths -->
  <!-- Input -> Extractor -->
  <path d="M 160 180 L 210 180" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow)"/>
  
  <!-- Extractor -> Retriever -->
  <path d="M 370 180 L 420 180" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Retriever Split -> Critic & RedTeam -->
  <path d="M 580 180 L 610 180 L 610 120 L 640 120" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 580 180 L 610 180 L 610 240 L 640 240" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Critic & RedTeam Merge -> Synthesizer -->
  <path d="M 800 120 L 830 120 L 830 180 L 850 180" stroke="#4ade80" stroke-width="2"/>
  <path d="M 800 240 L 830 240 L 830 180 L 850 180" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Synthesizer -> Output UI -->
  <path d="M 500 375 L 500 400 L 500 410" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node 0: Input Manuscript -->
  <g filter="url(#shadow)">
    <rect x="30" y="140" width="130" height="80" rx="12" fill="url(#cardGrad)" stroke="#3b1c4e" stroke-width="2"/>
    <text x="95" y="172" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#f3f0f8" text-anchor="middle">Input Manuscript</text>
    <text x="95" y="192" font-family="Inter, sans-serif" font-size="10" fill="#a29ab5" text-anchor="middle">PDF File / arXiv ID</text>
  </g>

  <!-- Node 1: Claim Extractor -->
  <g filter="url(#shadow)">
    <rect x="210" y="140" width="160" height="80" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="220" y="150" width="60" height="18" rx="4" fill="url(#purpleGlow)"/>
    <text x="250" y="163" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">NODE 01</text>
    <text x="290" y="188" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f3f0f8" text-anchor="middle">Claim Extractor</text>
    <text x="290" y="206" font-family="Inter, sans-serif" font-size="10" fill="#a29ab5" text-anchor="middle">Parses Citations [1], [2]</text>
  </g>

  <!-- Node 2: Evidence Retriever -->
  <g filter="url(#shadow)">
    <rect x="420" y="140" width="160" height="80" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="430" y="150" width="60" height="18" rx="4" fill="url(#purpleGlow)"/>
    <text x="460" y="163" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">NODE 02</text>
    <text x="500" y="188" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f3f0f8" text-anchor="middle">Evidence Retriever</text>
    <text x="500" y="206" font-family="Inter, sans-serif" font-size="10" fill="#a29ab5" text-anchor="middle">arXiv / PMC / Tavily</text>
  </g>

  <!-- Node 3: Critic Judge -->
  <g filter="url(#shadow)">
    <rect x="640" y="80" width="160" height="80" rx="12" fill="url(#cardGrad)" stroke="#4ade80" stroke-width="2"/>
    <rect x="650" y="90" width="60" height="18" rx="4" fill="url(#greenGlow)"/>
    <text x="680" y="103" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">NODE 03</text>
    <text x="720" y="128" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">Critic Judge</text>
    <text x="720" y="146" font-family="Inter, sans-serif" font-size="10" fill="#a29ab5" text-anchor="middle">GPT-4o Entailment</text>
  </g>

  <!-- Node 4: Red-Team Judge -->
  <g filter="url(#shadow)">
    <rect x="640" y="200" width="160" height="80" rx="12" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="2"/>
    <rect x="650" y="210" width="60" height="18" rx="4" fill="url(#amberGlow)"/>
    <text x="680" y="223" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">NODE 04</text>
    <text x="720" y="248" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">Red-Team Judge</text>
    <text x="720" y="266" font-family="Inter, sans-serif" font-size="10" fill="#a29ab5" text-anchor="middle">Claude Adversarial</text>
  </g>

  <!-- Consensus Container Bar -->
  <rect x="625" y="65" width="190" height="230" rx="16" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,6"/>
  <text x="720" y="55" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#8b5cf6" text-anchor="middle">PARALLEL ADVERSARIAL CONSENSUS</text>

  <!-- Node 5: Synthesizer & Two Pens Resolution -->
  <g filter="url(#shadow)">
    <rect x="250" y="300" width="500" height="75" rx="14" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="265" y="312" width="60" height="18" rx="4" fill="url(#purpleGlow)"/>
    <text x="295" y="325" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">NODE 05</text>
    <text x="500" y="330" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#f3f0f8" text-anchor="middle">Two Pens Synthesizer &amp; Stroke Resolver</text>
    <text x="500" y="352" font-family="Inter, sans-serif" font-size="11" fill="#a29ab5" text-anchor="middle">Computes Trust Score (0–100%) • Generates Offset Green &amp; Amber Passage Highlighting</text>
  </g>

  <!-- Output UI Presentation Layer -->
  <g filter="url(#shadow)">
    <rect x="200" y="410" width="600" height="45" rx="10" fill="#131024" stroke="#3b1c4e" stroke-width="1.5"/>
    <text x="500" y="437" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f3f0f8" text-anchor="middle">
      Interactive Dashboard • Trust Report • Live Terminal Trace • Token Cost Ledger
    </text>
  </g>
</svg>
